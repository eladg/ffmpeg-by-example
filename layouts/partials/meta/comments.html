<div id="gitalk-container"></div>

<script type="text/javascript">
  const commentsConfig = {
    clientID: '261680ee2ed8936c0a49',
    clientSecret: '8da11bb90a46edcbcb9c71b79adccbd26700f252',
    repo: 'ffmpeg-by-example',  // The repository of store comments,
    owner: 'eladg',
    admin: ['eladg'],
    id: location.pathname.split("examples/")[1].split("/")[0], // get id from location.pathname
    distractionFreeMode: false  // Facebook-like distraction free mode
  }

  // Gitalk builds its "N comments" link as `href="' + (issue && issue.html_url) + '"`,
  // so pages without a GitHub issue get href="null", which resolves to <page>/null.
  // Drop any href/src that isn't a real URL whenever Gitalk (re)renders.
  const stripBadUrls = (root) => {
    root.querySelectorAll('[href], [src]').forEach((el) => {
      ['href', 'src'].forEach((attr) => {
        const value = el.getAttribute(attr);
        if (value !== null && ['', 'null', 'undefined'].includes(value.trim())) {
          el.removeAttribute(attr);
        }
      });
    });
  };

  const gitalkContainer = document.getElementById('gitalk-container');
  new MutationObserver(() => stripBadUrls(gitalkContainer)).observe(gitalkContainer, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ['href', 'src'],
  });

  // Gitalk is large (~790 KB): load it and its stylesheet only when the comments are about to scroll into view
  const loadGitalk = () => {
    const style = document.createElement('link');
    style.rel = 'stylesheet';
    style.href = 'https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css';
    document.head.appendChild(style);

    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js';
    script.onload = () => new window.Gitalk(commentsConfig).render('gitalk-container');
    document.head.appendChild(script);
  };

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      if (entries.some((entry) => entry.isIntersecting)) {
        observer.disconnect();
        loadGitalk();
      }
    }, { rootMargin: '600px 0px' });
    observer.observe(gitalkContainer);
  } else {
    loadGitalk();
  }
</script>
