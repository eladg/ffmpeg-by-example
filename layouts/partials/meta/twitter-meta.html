<meta name="twitter:site" content="@elad_g">
<meta name="twitter:creator" content="@elad_g">
{{ if .IsPage }}
<meta name="twitter:description" content="{{ default .Summary .Description }}" />
<meta name="twitter:title" content="{{ .Title }}" />
{{ else }}
<meta name="twitter:title" content="{{ .Site.Title }}" />
<meta name="twitter:description" content="{{ .Description }}" />
{{ end }}

{{/* Same image as og:image (facebook-meta.html) */}}
<meta name="twitter:card" content="summary_large_image" />
{{ with .Params.image }}
<meta name="twitter:image" content="{{ $.Permalink }}{{ . }}" />
{{ else }}
<meta name="twitter:image" content="{{ "img/share-card.png" | absURL }}" />
<meta name="twitter:image:alt" content="FFmpegByExample" />
{{ end }}
