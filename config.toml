title = "FFmpeg By Example"
# production URL: canonicals, sitemap and feeds must be absolute.
# `hugo server` uses localhost, and Netlify previews override it (see netlify.toml).
baseURL = "https://ffmpegbyexample.com/"
enableRobotsTXT = true

[pagination]
  pagerSize = 50

[params]
  # empty = same origin, so production, deploy previews and branch deploys each call their own functions
  apiURL = ""
  # apiURL = "http://localhost:8888"
  favicon = "/favicon.ico"
  description = "Explore the depth of FFmpeg with Examples"
  examplestypes = ["no-preview", "picture", "video-url", "youtube-embed", "audio"]
  [params.author]
    name = "Elad Gariany"
[permalinks]
  posts = "/:title/"

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "AMP", "RSS", "REDIRECTS"]
  page = ["HTML"]

# Netlify _redirects, generated from content by layouts/index.redirects
[mediaTypes."text/netlify"]
  delimiter = ""

[outputFormats.REDIRECTS]
  mediaType = "text/netlify"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true

[examples]

[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "dracula"
    tabWidth = 4
